<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="card">
        <h1>Create an account</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="display_name">Display name</label>
            <input id="display_name" name="display_name" maxlength="80" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="254" required>

            <label for="password">Password (12–128 characters)</label>
            <input id="password" name="password" type="password" minlength="12"
                   maxlength="128" required>

            <button type="submit">Register</button>
        </form>
        <p><a href="/login">Log in</a></p>
    </main>
</body>
</html>
