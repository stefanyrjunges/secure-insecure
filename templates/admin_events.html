<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security events</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="card">
        <h1>Recent security events</h1>
        <ul class="user-list">
            {% for event in events %}
                <li>
                    <strong>{{ event['event_type'] }}</strong>
                    <span>{{ event['created_at'] }} - {{ event['email'] or 'Unknown account' }}</span>
                </li>
            {% else %}
                <li>No security events have been recorded.</li>
            {% endfor %}
        </ul>
        <p><a href="/admin/users">Back to user management</a></p>
    </main>
</body>
</html>
